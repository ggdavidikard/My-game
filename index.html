<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Hit the Island</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;position:fixed;top:0;left:0}
#game{position:fixed;top:0;left:0;width:100%;height:100%;display:block;z-index:1;pointer-events:auto;touch-action:none}

#island{position:fixed;top:11px;left:50%;width:126px;height:37px;margin-left:-63px;background:#000;border-radius:20px;z-index:9999;pointer-events:none;transition:width .5s cubic-bezier(.22,1.4,.36,1),height .5s cubic-bezier(.22,1.4,.36,1),margin-left .5s cubic-bezier(.22,1.4,.36,1),border-radius .5s,box-shadow .3s,background .35s;box-shadow:0 0 0 .5px rgba(255,255,255,.15),0 0 40px rgba(90,208,255,.15)}
#island.hit{width:190px;height:56px;margin-left:-95px;border-radius:28px;background:#051322;box-shadow:0 0 0 2px #26e0ff,0 0 60px #26e0ff,0 0 120px rgba(38,224,255,.6)}
#island.combo{width:230px;height:66px;margin-left:-115px;border-radius:34px;background:#1a1205;box-shadow:0 0 0 2.5px #ffe066,0 0 80px #ffe066}
#island.miss{background:#220510;box-shadow:0 0 0 2px #ff4466,0 0 60px #ff4466}

body.classic{background:#fff}
body.classic #island{background:#000;box-shadow:0 0 0 .5px #000}
body.classic #island.hit{background:#000;box-shadow:0 0 0 2px #000}
body.classic #island.combo{background:#000;box-shadow:0 0 0 3px #000}
body.classic #island.miss{background:#000;box-shadow:0 0 0 2px #000}

#ui{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud{position:absolute;top:100px;left:0;right:0;display:flex;justify-content:space-around;color:#fff;font-weight:900;font-size:38px;letter-spacing:-1.5px;text-shadow:0 2px 16px rgba(0,0,0,.9);pointer-events:none}
body.classic #hud{text-shadow:none;color:#000}
.score-box{min-width:70px;text-align:center;color:#5ad0ff;pointer-events:none}
body.classic .score-box{color:#000}
#bestScore{color:#fff;font-size:12px;text-align:center;opacity:.5;margin-top:6px;font-weight:700;letter-spacing:3px;pointer-events:none}
body.classic #bestScore{color:#000}

#pauseBtn{position:absolute;top:60px;right:20px;width:46px;height:46px;border-radius:23px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:20px;font-weight:900;display:none;align-items:center;justify-content:center;pointer-events:none;cursor:pointer;font-family:inherit;z-index:6}
#pauseBtn.show{display:flex;pointer-events:auto}
#pauseBtn:active{transform:scale(.9)}
body.classic #pauseBtn{background:#fff;border:2px solid #000;color:#000}

#overlay,#menu{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(circle at 50% 30%,rgba(10,30,60,.95),rgba(0,0,0,.99));z-index:100;padding:24px;text-align:center;pointer-events:none}
body.classic #overlay,body.classic #menu{background:#fff}
#overlay.show,#menu.show{display:flex;pointer-events:auto}

#title{font-size:clamp(30px,10vw,44px);font-weight:900;background:linear-gradient(135deg,#7df9ff,#3fd0ff,#b980ff);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-1.5px;line-height:1;animation:titleFloat 3s ease-in-out infinite;filter:drop-shadow(0 0 20px rgba(80,200,255,.6))}
body.classic #title{background:none;color:#000;-webkit-text-fill-color:#000;filter:none}
@keyframes titleFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
#subtitle{color:#9fd8ff;font-size:11px;font-weight:800;letter-spacing:6px;text-transform:uppercase}
body.classic #subtitle{color:#444}

.btn{padding:18px 48px;border-radius:44px;border:none;background:linear-gradient(135deg,#26e0ff,#4a7bff);color:#fff;font-size:20px;font-weight:900;letter-spacing:1.5px;box-shadow:0 12px 36px rgba(60,180,255,.55);cursor:pointer;font-family:inherit;min-width:220px;animation:pulse 2s ease-in-out infinite;pointer-events:auto;touch-action:manipulation}
.btn:active{transform:scale(.95)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
body.classic .btn{background:#000;color:#fff;border:2px solid #000;box-shadow:none;animation:none}
body.classic .btn:active{background:#fff;color:#000}

#bestLabel{color:#7ab8e0;font-size:13px;font-weight:600;letter-spacing:1px}
body.classic #bestLabel{color:#444}
#bestValue,#bestValue2{color:#fff;font-weight:900}
body.classic #bestValue,body.classic #bestValue2{color:#000}

.splash{position:fixed;pointer-events:none;font-size:24px;font-weight:900;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.7);animation:splashUp .9s cubic-bezier(.22,1,.36,1) forwards;z-index:10;transform:translate(-50%,0)}
body.classic .splash{text-shadow:none;color:#000}
@keyframes splashUp{0%{transform:translate(-50%,0) scale(.4);opacity:0}30%{transform:translate(-50%,-40px) scale(1.35);opacity:1}100%{transform:translate(-50%,-110px) scale(1);opacity:0}}

#combo{position:fixed;top:34%;left:50%;transform:translate(-50%,-50%);font-size:64px;font-weight:900;color:#fff;text-shadow:0 0 30px #26e0ff,0 0 70px #4a7bff;pointer-events:none;opacity:0;z-index:20;letter-spacing:-2px}
body.classic #combo{text-shadow:none;color:#000}
#combo.show{animation:comboPop .85s cubic-bezier(.22,1.4,.36,1)}
@keyframes comboPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-18deg)}40%{opacity:1;transform:translate(-50%,-50%) scale(1.25) rotate(6deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(1) rotate(0)}}

#menuTitle{font-size:clamp(26px,9vw,40px);font-weight:900;background:linear-gradient(135deg,#7df9ff,#3fd0ff,#b980ff);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-1.5px;margin-bottom:10px}
body.classic #menuTitle{background:none;color:#000;-webkit-text-fill-color:#000}

.menuSection{width:100%;max-width:320px;display:flex;flex-direction:column;gap:10px}
.menuLabel{color:#7ab8e0;font-size:11px;font-weight:800;letter-spacing:4px;text-transform:uppercase;margin-bottom:4px}
body.classic .menuLabel{color:#444}

.themeSwitcher{display:flex;gap:10px}
.themeBtn{flex:1;padding:16px 20px;border-radius:16px;border:2px solid rgba(38,224,255,.3);background:rgba(38,224,255,.08);color:#5ad0ff;font-size:14px;font-weight:900;letter-spacing:1px;cursor:pointer;font-family:inherit;transition:all .25s;touch-action:manipulation;pointer-events:auto}
.themeBtn:active{transform:scale(.95)}
.themeBtn.active{background:linear-gradient(135deg,#26e0ff,#4a7bff);color:#fff;border-color:#26e0ff;box-shadow:0 8px 24px rgba(60,180,255,.5)}
body.classic .themeBtn{background:#fff;color:#000;border:2px solid #000;box-shadow:none}
body.classic .themeBtn.active{background:#000;color:#fff}
body.classic .themeBtn:active{background:#888;color:#fff}

.menuBtn{width:100%;padding:18px 24px;border-radius:16px;border:none;background:linear-gradient(135deg,#26e0ff,#4a7bff);color:#fff;font-size:18px;font-weight:900;letter-spacing:1.5px;cursor:pointer;font-family:inherit;box-shadow:0 10px 30px rgba(60,180,255,.5);touch-action:manipulation;pointer-events:auto}
.menuBtn:active{transform:scale(.96)}
body.classic .menuBtn{background:#000;color:#fff;border:2px solid #000;box-shadow:none}
body.classic .menuBtn:active{background:#fff;color:#000}

#menuBest{color:#7ab8e0;font-size:13px;font-weight:700;margin-top:8px;letter-spacing:2px}
body.classic #menuBest{color:#444}
#menuBestValue{color:#fff;font-weight:900}
body.classic #menuBestValue{color:#000}
</style>
</head>
<body>

<canvas id="game"></canvas>
<div id="island"></div>

<div id="ui">
  <div id="hud">
    <div class="score-box" id="scorePlayer">0</div>
    <div class="score-box" id="scoreIsland">0</div>
  </div>
  <div id="bestScore">РЕКОРД: <span id="bestValue">0</span></div>
  <button id="pauseBtn" type="button">☰</button>
</div>

<div id="combo"></div>

<div id="overlay" class="show">
  <div id="subtitle">HIT THE</div>
  <div id="title">ISLAND</div>
  <button id="playBtn" class="btn" type="button">ИГРАТЬ</button>
  <div id="bestLabel">Рекорд: <span id="bestValue2">0</span></div>
</div>

<div id="menu">
  <div id="menuTitle">ПАУЗА</div>
  <div class="menuSection">
    <div class="menuLabel">Тема</div>
    <div class="themeSwitcher">
      <button class="themeBtn" data-theme="neon" type="button">НЕОН</button>
      <button class="themeBtn" data-theme="classic" type="button">КЛАССИКА</button>
    </div>
  </div>
  <div class="menuSection">
    <button class="menuBtn" id="resumeBtn" type="button">ПРОДОЛЖИТЬ</button>
    <button class="menuBtn" id="restartBtn" type="button">ЗАНОВО</button>
    <button class="menuBtn" id="exitBtn" type="button">В ГЛАВНОЕ МЕНЮ</button>
  </div>
  <div id="menuBest">РЕКОРД: <span id="menuBestValue">0</span></div>
</div>

<script>
(function(){
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  var ISLAND_W = 126, ISLAND_H = 37, ISLAND_TOP = 11;
  var islandRect = { x:0, y:ISLAND_TOP, w:ISLAND_W, h:ISLAND_H };
  var islandEl = document.getElementById('island');

  var theme = localStorage.getItem('hitTheme') || 'neon';

  function applyTheme(t) {
    theme = t;
    localStorage.setItem('hitTheme', t);
    if (t === 'classic') document.body.classList.add('classic');
    else document.body.classList.remove('classic');
    var btns = document.querySelectorAll('.themeBtn');
    for (var i = 0; i < btns.length; i++) {
      if (btns[i].getAttribute('data-theme') === t) btns[i].classList.add('active');
      else btns[i].classList.remove('active');
    }
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    islandRect.w = ISLAND_W;
    islandRect.h = ISLAND_H;
    islandRect.x = (W - ISLAND_W) / 2;
    islandRect.y = ISLAND_TOP;
  }
  resize();
  window.addEventListener('resize', function(){ setTimeout(resize, 100); });
  window.addEventListener('orientationchange', function(){ setTimeout(resize, 250); });

  var state = {
    running: false,
    paused: false,
    playerScore: 0,
    islandScore: 0,
    best: parseInt(localStorage.getItem('hitBest') || '0', 10),
    rally: 0,
    combo: 0,
    shake: 0
  };

  var scorePlayerEl = document.getElementById('scorePlayer');
  var scoreIslandEl = document.getElementById('scoreIsland');
  var pauseBtn = document.getElementById('pauseBtn');
  var overlayEl = document.getElementById('overlay');
  var menuEl = document.getElementById('menu');

  document.getElementById('bestValue').textContent = state.best;
  document.getElementById('bestValue2').textContent = state.best;
  document.getElementById('menuBestValue').textContent = state.best;

  var paddle = { x:0, y:0, w:110, h:16, targetX:0 };
  var ball = { x:0, y:0, vx:0, vy:0, r:11, trail:[], active:false };
  var particles = [];

  function resetBall() {
    ball.x = islandRect.x + islandRect.w/2 + (Math.random()-0.5)*40;
    ball.y = islandRect.y + islandRect.h + 30;
    var a = (Math.random()-0.5) * 0.7;
    var s = 5 + Math.random()*1.5;
    ball.vx = Math.sin(a) * s;
    ball.vy = Math.cos(a) * s;
    ball.trail = [];
    ball.active = true;
    state.rally = 0;
  }

  function resetPaddle() {
    paddle.targetX = W/2;
    paddle.x = W/2;
    paddle.y = H - 130;
  }

  function onMove(x) {
    if (!state.running || state.paused) return;
    paddle.targetX = Math.max(paddle.w/2 + 12, Math.min(W - paddle.w/2 - 12, x));
  }

  var pointerActive = false;

  canvas.addEventListener('pointerdown', function(e){
    if (!state.running || state.paused) return;
    pointerActive = true;
    onMove(e.clientX);
    if (canvas.setPointerCapture) {
      try { canvas.setPointerCapture(e.pointerId); } catch(err){}
    }
    e.preventDefault();
  }, {passive: false});

  canvas.addEventListener('pointermove', function(e){
    if (!pointerActive) return;
    if (!state.running || state.paused) return;
    onMove(e.clientX);
  }, {passive: false});

  canvas.addEventListener('pointerup', function(){
    pointerActive = false;
  }, {passive: false});

  canvas.addEventListener('pointercancel', function(){
    pointerActive = false;
  }, {passive: false});

  if (!window.PointerEvent) {
    canvas.addEventListener('touchstart', function(e){
      if (!state.running || state.paused) return;
      e.preventDefault();
      if (e.touches[0]) onMove(e.touches[0].clientX);
    }, {passive: false});
    canvas.addEventListener('touchmove', function(e){
      if (!state.running || state.paused) return;
      e.preventDefault();
      if (e.touches[0]) onMove(e.touches[0].clientX);
    }, {passive: false});
    canvas.addEventListener('mousedown', function(e){
      if (!state.running || state.paused) return;
      onMove(e.clientX);
    });
    canvas.addEventListener('mousemove', function(e){
      if (!state.running || state.paused) return;
      if (e.buttons) onMove(e.clientX);
    });
  }

  var islandTimer = null;
  function expandIsland(cls, dur) {
    if (islandTimer) clearTimeout(islandTimer);
    islandEl.classList.remove('hit','miss','combo');
    void islandEl.offsetWidth;
    islandEl.classList.add(cls);
    islandTimer = setTimeout(function(){
      islandEl.classList.remove(cls);
      islandTimer = null;
    }, dur || 500);
  }

  function popScore(el) {
    el.style.transition = 'transform 0.15s';
    el.style.transform = 'scale(1.35)';
    setTimeout(function(){
      el.style.transform = 'scale(1)';
    }, 200);
  }

  function updateBall(dt) {
    if (!ball.active) return;
    var f = dt/16.67;

    ball.trail.push({x:ball.x, y:ball.y, life:1});
    if (ball.trail.length > 16) ball.trail.shift();
    for (var i = 0; i < ball.trail.length; i++) ball.trail[i].life -= 0.055*f;
    ball.trail = ball.trail.filter(function(t){ return t.life > 0; });

    var prevY = ball.y;
    ball.x += ball.vx*f;
    ball.y += ball.vy*f;

    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); spawnParticles(ball.x, ball.y, 6); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); spawnParticles(ball.x, ball.y, 6); }

    var iBottom = islandRect.y + islandRect.h;
    var iLeft = islandRect.x - 4;
    var iRight = islandRect.x + islandRect.w + 4;

    if (ball.vy < 0 && prevY - ball.r > iBottom && ball.y - ball.r <= iBottom && ball.x >= iLeft && ball.x <= iRight) {
      ball.y = iBottom + ball.r + 1;
      ball.vy = Math.abs(ball.vy);
      ball.vx += (Math.random()-0.5) * 2.5;

      var sp = Math.sqrt(ball.vx*ball.vx + ball.vy*ball.vy);
      var maxSp = 16;
      if (sp > maxSp) { ball.vx = ball.vx/sp*maxSp; ball.vy = ball.vy/sp*maxSp; }

      state.rally++;
      state.combo++;
      var pts = 1 + Math.floor(state.rally/5) * 2;
      state.playerScore += pts;

      spawnParticles(ball.x, iBottom, 28);
      spawnSplash(ball.x, iBottom + 10, '+' + pts);
      popScore(scorePlayerEl);

      if (state.combo > 0 && state.combo % 10 === 0) {
        expandIsland('combo', 700);
        showCombo(state.combo);
        state.shake = 16;
        if (navigator.vibrate) navigator.vibrate([40,30,40,30,60]);
      } else {
        expandIsland('hit', 500);
        state.shake = 10;
        if (navigator.vibrate) navigator.vibrate([25,15,25]);
      }
      updateHUD();
      return;
    }

    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); spawnParticles(ball.x, 0, 8); }

    var px = paddle.x - paddle.w/2;
    var py = paddle.y - paddle.h/2;
    if (ball.vy > 0 && ball.y + ball.r > py && ball.y - ball.r < py + paddle.h + 24 &&
        ball.x > px - ball.r && ball.x < px + paddle.w + ball.r) {
      ball.y = py - ball.r - 1;
      ball.vy = -Math.abs(ball.vy);
      var hp = (ball.x - paddle.x) / (paddle.w/2);
      ball.vx = hp * 7.5;
      ball.vy = -Math.abs(ball.vy) - 0.2;
      var sp2 = Math.sqrt(ball.vx*ball.vx + ball.vy*ball.vy);
      var maxSp2 = 16;
      if (sp2 > maxSp2) { ball.vx = ball.vx/sp2*maxSp2; ball.vy = ball.vy/sp2*maxSp2; }
      state.rally = 0;
      spawnParticles(ball.x, py, 12);
      if (navigator.vibrate) navigator.vibrate(12);
    }

    if (ball.y - ball.r > H) {
      ball.active = false;
      state.islandScore++;
      state.rally = 0;
      state.combo = 0;
      spawnParticles(ball.x, H - 20, 30);
      state.shake = 14;
      expandIsland('miss', 500);
      popScore(scoreIslandEl);
      if (navigator.vibrate) navigator.vibrate([80,40,80]);
      updateHUD();
      if (state.islandScore >= 10) { setTimeout(gameOver, 400); return; }
      setTimeout(function(){ if (state.running && !state.paused) resetBall(); }, 500);
    }
  }

  function updatePaddle(dt) {
    var f = dt/16.67;
    paddle.x += (paddle.targetX - paddle.x) * 0.35 * f;
  }

  function spawnParticles(x, y, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random()*Math.PI*2;
      var s = 2 + Math.random()*7;
      particles.push({ x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:1, decay:0.022 + Math.random()*0.02, size:2 + Math.random()*5 });
    }
  }
  function updateParticles(dt) {
    var f = dt/16.67;
    for (var i = particles.length-1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx*f; p.y += p.vy*f;
      p.vy += 0.2*f; p.vx *= 0.99;
      p.life -= p.decay*f;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }
  function drawParticles() {
    var classic = theme === 'classic';
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = p.life;
      if (classic) {
        ctx.fillStyle = '#000';
        ctx.shadowBlur = 0;
      } else {
        ctx.fillStyle = '#26e0ff';
        ctx.shadowColor = '#26e0ff';
        ctx.shadowBlur = 14;
      }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size*p.life, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }

  function spawnSplash(x, y, text) {
    var el = document.createElement('div');
    el.className = 'splash';
    if (theme === 'classic') el.style.color = '#000';
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    document.body.appendChild(el);
    setTimeout(function(){ el.remove(); }, 900);
  }

  var comboEl = document.getElementById('combo');
  function showCombo(n) {
    comboEl.textContent = 'x' + n + '!';
    if (theme === 'classic') comboEl.style.color = '#000';
    else comboEl.style.color = '#fff';
    comboEl.classList.remove('show');
    void comboEl.offsetWidth;
    comboEl.classList.add('show');
  }

  function updateHUD() {
    scorePlayerEl.textContent = state.playerScore;
    scoreIslandEl.textContent = state.islandScore;
  }

  function drawBackground() {
    var classic = theme === 'classic';
    if (classic) {
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, W, H);
    } else {
      var bg = ctx.createRadialGradient(W/2, H*0.35, 0, W/2, H*0.35, H*1.1);
      bg.addColorStop(0, '#0d1f38');
      bg.addColorStop(0.6, '#050a14');
      bg.addColorStop(1, '#000');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      var gx = islandRect.x + islandRect.w/2;
      var gy = islandRect.y + islandRect.h;
      var beam = ctx.createLinearGradient(gx, gy, gx, gy + 340);
      beam.addColorStop(0, 'rgba(90,208,255,0.18)');
      beam.addColorStop(1, 'rgba(90,208,255,0)');
      ctx.fillStyle = beam;
      ctx.beginPath();
      ctx.moveTo(gx-24, gy);
      ctx.lineTo(gx+24, gy);
      ctx.lineTo(gx+100, gy+340);
      ctx.lineTo(gx-100, gy+340);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawPaddle() {
    var classic = theme === 'classic';
    var px = paddle.x - paddle.w/2;
    var py = paddle.y - paddle.h/2;
    if (!classic) { ctx.shadowColor = '#26e0ff'; ctx.shadowBlur = 28; }
    var grad = ctx.createLinearGradient(0, py, 0, py + paddle.h);
    if (classic) { grad.addColorStop(0, '#000'); grad.addColorStop(1, '#000'); }
    else { grad.addColorStop(0, '#7df9ff'); grad.addColorStop(0.5, '#26e0ff'); grad.addColorStop(1, '#4a7bff'); }
    ctx.fillStyle = grad;
    var r = paddle.h/2;
    ctx.beginPath();
    ctx.moveTo(px+r, py);
    ctx.lineTo(px+paddle.w-r, py);
    ctx.arcTo(px+paddle.w, py, px+paddle.w, py+r, r);
    ctx.lineTo(px+paddle.w, py+paddle.h-r);
    ctx.arcTo(px+paddle.w, py+paddle.h, px+paddle.w-r, py+paddle.h, r);
    ctx.lineTo(px+r, py+paddle.h);
    ctx.arcTo(px, py+paddle.h, px, py+paddle.h-r, r);
    ctx.lineTo(px, py+r);
    ctx.arcTo(px, py, px+r, py, r);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawBall() {
    if (!ball.active) return;
    var classic = theme === 'classic';

    for (var i = 0; i < ball.trail.length; i++) {
      var t = ball.trail[i];
      var a = t.life * (i/ball.trail.length) * 0.65;
      ctx.globalAlpha = a;
      if (classic) {
        ctx.fillStyle = '#333';
        ctx.shadowBlur = 0;
      } else {
        ctx.fillStyle = '#5ad0ff';
        ctx.shadowColor = '#5ad0ff';
        ctx.shadowBlur = 10;
      }
      ctx.beginPath();
      ctx.arc(t.x, t.y, ball.r * (i/ball.trail.length), 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

    if (!classic) { ctx.shadowColor = '#7df9ff'; ctx.shadowBlur = 28; }
    var grad = ctx.createRadialGradient(ball.x-3, ball.y-3, 1, ball.x, ball.y, ball.r);
    if (classic) { grad.addColorStop(0, '#000'); grad.addColorStop(1, '#000'); }
    else { grad.addColorStop(0, '#fff'); grad.addColorStop(0.55, '#7df9ff'); grad.addColorStop(1, '#26e0ff'); }
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  var lastTime = performance.now();
  function loop(now) {
    var dt = Math.min(50, now - lastTime);
    lastTime = now;

    ctx.save();
    if (state.shake > 0) {
      var s = state.shake;
      ctx.translate((Math.random()-0.5)*s, (Math.random()-0.5)*s);
      state.shake *= 0.85;
      if (state.shake < 0.3) state.shake = 0;
    }

    drawBackground();
    if (state.running && !state.paused) {
      updatePaddle(dt);
      updateBall(dt);
    }
    drawPaddle();
    drawBall();
    updateParticles(dt);
    drawParticles();
    ctx.restore();

    requestAnimationFrame(loop);
  }

  function startGame() {
    state.running = true;
    state.paused = false;
    state.playerScore = 0;
    state.islandScore = 0;
    state.rally = 0;
    state.combo = 0;
    state.shake = 0;
    particles.length = 0;
    updateHUD();
    resetPaddle();
    resetBall();
    overlayEl.classList.remove('show');
    menuEl.classList.remove('show');
    pauseBtn.classList.add('show');
    if (navigator.vibrate) navigator.vibrate(30);
  }

  function openMenu() {
    if (!state.running) return;
    state.paused = true;
    menuEl.classList.add('show');
    pauseBtn.classList.remove('show');
  }

  function closeMenu() {
    menuEl.classList.remove('show');
    if (state.running) {
      state.paused = false;
      pauseBtn.classList.add('show');
    }
  }

  function exitToMain() {
    state.running = false;
    state.paused = false;
    menuEl.classList.remove('show');
    pauseBtn.classList.remove('show');
    overlayEl.classList.add('show');
    updateHUD();
  }

  function gameOver() {
    state.running = false;
    pauseBtn.classList.remove('show');
    if (state.playerScore > state.best) {
      state.best = state.playerScore;
      try { localStorage.setItem('hitBest', state.best); } catch(e){}
    }
    document.getElementById('bestValue').textContent = state.best;
    document.getElementById('bestValue2').textContent = state.best;
    document.getElementById('menuBestValue').textContent = state.best;

    overlayEl.innerHTML =
      '<div id="subtitle">GAME OVER</div>' +
      '<div id="title">' + state.playerScore + ' : ' + state.islandScore + '</div>' +
      '<div id="bestLabel">Рекорд: <span style="color:' + (theme === 'classic' ? '#000' : '#fff') + ';font-weight:900">' + state.best + '</span></div>' +
      '<button id="playBtn" class="btn" type="button">ЕЩЁ РАЗ</button>';
    overlayEl.classList.add('show');

    var newPlay = document.getElementById('playBtn');
    newPlay.addEventListener('click', function(e){ e.preventDefault(); startGame(); });
    newPlay.addEventListener('touchend', function(e){ e.preventDefault(); startGame(); }, {passive:false});
  }

  function bindBtn(id, handler) {
    var el = document.getElementById(id);
    if (!el) return;
    var fired = false;
    function fire(e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      if (fired) return;
      fired = true;
      setTimeout(function(){ fired = false; }, 300);
      handler();
    }
    el.addEventListener('touchend', fire, {passive:false});
    el.addEventListener('click', fire);
  }

  bindBtn('playBtn', startGame);
  bindBtn('pauseBtn', openMenu);
  bindBtn('resumeBtn', closeMenu);
  bindBtn('restartBtn', function(){ closeMenu(); startGame(); });
  bindBtn('exitBtn', exitToMain);

  var themeBtns = document.querySelectorAll('.themeBtn');
  for (var i = 0; i < themeBtns.length; i++) {
    (function(btn){
      btn.addEventListener('click', function(e){
        e.preventDefault();
        applyTheme(btn.getAttribute('data-theme'));
      });
    })(themeBtns[i]);
  }

  applyTheme(theme);
  resetPaddle();

  requestAnimationFrame(loop);

  document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
  document.addEventListener('dblclick', function(e){ e.preventDefault(); });
})();
</script>
</body>
</html>
